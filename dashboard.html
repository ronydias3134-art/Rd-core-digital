<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rd-core-digital | Avatarix-AI Dashboard</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1 { color: #38bdf8; font-size: 24px; margin-bottom: 10px; }
        .card { background: #334155; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        input, button { width: 100%; padding: 10px; margin-top: 8px; margin-bottom: 12px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { background: #0284c7; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #0369a1; }
        ul { list-style: none; padding: 0; }
        li { background: #475569; padding: 10px; margin-top: 5px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .status-pending { color: #facc15; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Rd-core-digital Dashboard</h1>
        <p>Ligado ao Supabase: <strong>Avatarix-AI</strong></p>
        
        <div class="card">
            <h3>Adicionar Nova Tarefa à Fila (Queue)</h3>
            <input type="text" id="taskName" placeholder="Nome da tarefa (ex: Gerar Vídeo)">
            <button onclick="addTask()">Adicionar Tarefa</button>
        </div>

        <div class="card">
            <h3>Tarefas na Fila</h3>
            <button onclick="loadTasks()">Atualizar Lista</button>
            <ul id="taskList">
                <li>A carregar tarefas...</li>
            </ul>
        </div>
    </div>

    <script>
        // Configuração Oficial do Supabase - Avatarix-AI / Rd Core Digital
        const SUPABASE_URL = 'https://uadnfsmlabucptikpgpo.supabase.co';
        const SUPABASE_ANON_KEY = 'Sb_publishable_VWA5sqc8cTqYQYopTxFe2A_exXLszA5';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadTasks() {
            const listEl = document.getElementById('taskList');
            
            const { data, error } = await supabaseClient
                .from('queue')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                listEl.innerHTML = `<li style="color: #ef4444;">Erro ao carregar: ${error.message}</li>`;
                return;
            }

            if (!data || data.length === 0) {
                listEl.innerHTML = '<li>Nenhuma tarefa encontrada na fila.</li>';
                return;
            }

            listEl.innerHTML = '';
            data.forEach(task => {
                const li = document.createElement('li');
                li.innerHTML = `<span><strong>${task.task_name}</strong></span> <span class="status-pending">${task.status}</span>`;
                listEl.appendChild(li);
            });
        }

        async function addTask() {
            const input = document.getElementById('taskName');
            const taskName = input.value.trim();

            if (!taskName) {
                alert('Insere o nome da tarefa!');
                return;
            }

            const { error } = await supabaseClient
                .from('queue')
                .insert([{ task_name: taskName, status: 'pending' }]);

            if (error) {
                alert('Erro ao adicionar: ' + error.message);
                return;
            }

            input.value = '';
            loadTasks();
        }

        // Carregar tarefas ao abrir a página e atualizar automaticamente a cada 5 segundos
        loadTasks();
        setInterval(loadTasks, 5000);
    </script>
</body>
</html>
