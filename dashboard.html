<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RD Core Digital - Painel Operacional</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #111827;
            --border-color: #1f2937;
            --accent-blue: #38bdf8;
            --accent-green: #34d399;
            --accent-purple: #a855f7;
            --accent-orange: #f97316;
            --accent-gold: #fbbf24;
            --text-main: #e2e8f0;
            --text-muted: #9ca3af;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; padding: 10px; font-size: 13px; }
        .container { max-width: 750px; margin: 0 auto; }
        
        .header-bar { background: var(--bg-card); padding: 12px 16px; border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
        .status-dot { height: 8px; width: 8px; background-color: var(--accent-green); border-radius: 50%; display: inline-block; margin-right: 8px; box-shadow: 0 0 8px var(--accent-green); }
        .title { font-size: 15px; font-weight: 800; color: var(--accent-blue); letter-spacing: 1px; text-transform: uppercase; display: inline-flex; align-items: center; }
        .version-badge { font-size: 10px; background: rgba(56, 189, 248, 0.1); color: var(--accent-blue); padding: 3px 8px; border-radius: 4px; border: 1px solid rgba(56, 189, 248, 0.2); font-weight: bold; }

        .card { background: var(--bg-card); padding: 14px; border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--border-color); box-sizing: border-box; }
        .card-title { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
        .section-title { font-size: 13px; color: var(--accent-blue); margin-bottom: 8px; font-weight: bold; display: flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: 0.5px; }

        input, select { width: 100%; padding: 8px 10px; margin-top: 4px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #374151; background: var(--bg-main); color: #fff; box-sizing: border-box; font-size: 12px; }
        button { width: 100%; padding: 9px 12px; margin-top: 4px; margin-bottom: 6px; border-radius: 6px; border: none; background: #0284c7; color: #fff; font-weight: bold; cursor: pointer; transition: all 0.2s ease; font-size: 12px; }
        button:hover { background: #0369a1; }
        button.secondary { background: #374151; color: var(--text-main); }
        button.secondary:hover { background: #4b5563; }
        
        ul { list-style: none; padding: 0; margin: 0; }
        li { background: #1f2937; padding: 8px 10px; margin-top: 5px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; border: 1px solid #374151; }
        .status-pending { color: var(--accent-gold); font-weight: bold; font-size: 11px; background: rgba(251, 191, 36, 0.1); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(251, 191, 36, 0.2); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <div class="title"><span class="status-dot"></span> PAINEL OPERACIONAL</div>
            <span class="version-badge">DASHBOARD v20.2</span>
        </div>

        <div class="card">
            <div class="section-title">⚡ Registo Rápido de Tarefas & Operações</div>
            <input type="text" id="dashTaskName" placeholder="Descrever nova tarefa operacional...">
            <div style="display: flex; gap: 6px;">
                <button onclick="addDashTask()" style="margin:0;">Registar na Base</button>
                <button class="secondary" onclick="loadDashTasks()" style="margin:0; width: auto; padding: 8px 12px;">Atualizar</button>
            </div>
            <div style="margin-top: 10px;">
                <ul id="dashTaskList">
                    <li>A carregar dados do Supabase...</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://uadnfsmlabucptikpgpo.supabase.co';
        const SUPABASE_ANON_KEY = 'Sb_publishable_VWA5sqc8cTqYQYopTxFe2A_exXLszA5';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadDashTasks() {
            const listEl = document.getElementById('dashTaskList');
            const { data, error } = await supabaseClient.from('queue').select('*').order('created_at', { ascending: false });
            if (error) { listEl.innerHTML = `<li style="color: #f87171;">Erro ao carregar dados</li>`; return; }
            if (!data || data.length === 0) { listEl.innerHTML = '<li>Nenhum registo encontrado.</li>'; return; }
            listEl.innerHTML = '';
            data.forEach(task => {
                const li = document.createElement('li');
                li.innerHTML = `<span><strong>${task.task_name}</strong></span> <span class="status-pending">${task.status}</span>`;
                listEl.appendChild(li);
            });
        }

        async function addDashTask() {
            const input = document.getElementById('dashTaskName');
            const taskName = input.value.trim();
            if (!taskName) return;
            await supabaseClient.from('queue').insert([{ task_name: 'Painel: ' + taskName, status: 'pending' }]);
            input.value = '';
            loadDashTasks();
        }

        loadDashTasks();
        setInterval(loadDashTasks, 5000);
    </script>
</body>
</html>
