<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecossistema Digital Autónomo</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --border-color: #334155;
            --success-color: #22c55e;
            --danger-color: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 480px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { font-size: 1.5rem; margin-bottom: 8px; text-align: center; color: var(--accent-color); }
        p.subtitle { text-align: center; color: #94a3b8; font-size: 0.875rem; margin-bottom: 24px; }
        .hidden { display: none !important; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.875rem; margin-bottom: 6px; color: #cbd5e1; }
        input[type="password"] { width: 100%; padding: 12px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-color); font-size: 1.2rem; text-align: center; letter-spacing: 4px; }
        button { width: 100%; padding: 12px; background: var(--accent-color); color: var(--bg-color); border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        .error { color: var(--danger-color); font-size: 0.8rem; text-align: center; margin-top: 8px; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
        .badge { background: rgba(56, 189, 248, 0.1); color: var(--accent-color); padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .card-metric { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
        .metric-title { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; }
        .metric-value { font-size: 1.5rem; font-weight: bold; color: var(--text-color); margin-top: 4px; }
        .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn-secondary { background: transparent; border: 1px solid var(--border-color); color: var(--text-color); }
        .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger-color); border: 1px solid var(--danger-color); }
    </style>
</head>
<body>

    <div class="container">
        <!-- TELA DE AUTENTICAÇÃO -->
        <div id="auth-screen">
            <h1>Ecossistema Autónomo</h1>
            <p class="subtitle">Introduza o PIN de segurança para aceder ao motor</p>
            <div class="form-group">
                <input type="password" id="pin-input" maxlength="4" placeholder="••••">
                <div id="error-msg" class="error hidden">PIN incorreto. Tente novamente.</div>
            </div>
            <button onclick="verifyPin()">Aceder ao Sistema</button>
        </div>

        <!-- PAINEL DE CONTROLO (DASHBOARD) -->
        <div id="dashboard-screen" class="hidden">
            <div class="dashboard-header">
                <h2>Painel Operacional</h2>
                <span class="badge">ONLINE (5% Margem)</span>
            </div>

            <div class="card-metric">
                <div class="metric-title">Estado do Motor</div>
                <div class="metric-value" style="color: var(--success-color); font-size: 1.1rem;">Sincronizado & Ativo</div>
            </div>

            <div class="card-metric">
                <div class="metric-title">Tesouraria Operacional</div>
                <div class="metric-value">5.0%</div>
            </div>

            <div class="actions-grid">
                <button class="btn-secondary" onclick="clearCache()">Limpar Cache</button>
                <button class="btn-danger" onclick="lockSystem()">Bloquear</button>
            </div>
        </div>
    </div>

    <script>
        const MASTER_PIN = "3134";

        function verifyPin() {
            const pin = document.getElementById('pin-input').value;
            const errorMsg = document.getElementById('error-msg');
            
            if (pin === MASTER_PIN) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');
            } else {
                errorMsg.classList.remove('hidden');
                document.getElementById('pin-input').value = '';
            }
        }

        function clearCache() {
            alert('Cache limpa com sucesso. Sistema otimizado.');
        }

        function lockSystem() {
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('pin-input').value = '';
            document.getElementById('error-msg').classList.add('hidden');
        }

        // Atalho para submeter com Enter
        document.getElementById('pin-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                verifyPin();
            }
        });
    </script>
</body>
</html>
