<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RD Core Digital - Centro de Comando</title>
    <!-- Framework de Design Mobile-First -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Cliente Oficial Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 font-sans antialiased">
    <div class="max-w-md mx-auto space-y-5">
        
        <!-- Cabeçalho e Estado da Ligação -->
        <header class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-emerald-400 tracking-tight">RD Core Digital</h1>
                <p class="text-xs text-slate-400 mt-0.5">Centro de Comando Autónomo</p>
            </div>
            <button onclick="carregarDadosDashboard()" class="bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-xs font-semibold px-3 py-2 rounded-lg border border-slate-700 transition">
                Atualizar
            </button>
        </header>

        <!-- Barra de Diagnóstico em Tempo Real -->
        <div id="status-bar" class="bg-slate-900/80 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-400 flex items-center justify-between">
            <span>Ligação Supabase:</span>
            <span id="connection-badge" class="font-bold text-amber-400">A verificar...</span>
        </div>

        <!-- Secção 1: Métricas e Visualizações dos Influencers -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-xs font-bold text-slate-300 uppercase tracking-wider">Publicações & Visualizações</h2>
                <span id="total-views-badge" class="text-xs font-bold text-emerald-400 bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-800/50">0 views</span>
            </div>
            <div id="metrics-container" class="space-y-3">
                <p class="text-xs text-slate-500 animate-pulse">A sincronizar métricas...</p>
            </div>
        </section>

        <!-- Secção 2: Fila de Agendamento (Temporal Jitter) -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg">
            <h2 class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-3">Fila de Disparo (Temporal Jitter)</h2>
            <div id="queue-container" class="space-y-2">
                <p class="text-xs text-slate-500 animate-pulse">A verificar fila de tarefas...</p>
            </div>
        </section>

        <!-- Secção 3: Controlo da Frota (Gavetas Estanques / Kill Switch) -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg">
            <h2 class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-3">Frota de Agentes (12 Gavetas)</h2>
            <div id="agents-container" class="grid grid-cols-1 gap-2">
                <p class="text-xs text-slate-500 animate-pulse">A verificar estados da frota...</p>
            </div>
        </section>

    </div>

    <script>
        // =========================================================================
        // CONFIGURAÇÃO OBRIGATÓRIA: Cola aqui os dados do teu Supabase
        // (Encontra em: Supabase > Project Settings > API)
        // =========================================================================
        const SUPABASE_URL = 'https://TEU-PROJETO.supabase.co';
        const SUPABASE_ANON_KEY = 'TUA-CHAVE-ANON-PUBLICA';
        // =========================================================================

        const badge = document.getElementById('connection-badge');
        let supabaseClient = null;

        // Valida se as chaves foram preenchidas antes de tentar ligar
        if (SUPABASE_URL.includes('TEU-PROJETO') || SUPABASE_ANON_KEY.includes('TUA-CHAVE')) {
            badge.textContent = 'FALTA INSERIR CHAVES';
            badge.className = 'font-bold text-red-400';
            document.getElementById('metrics-container').innerHTML = '<p class="text-xs text-amber-400">Edita o ficheiro index.html e coloca a tua SUPABASE_URL e SUPABASE_ANON_KEY.</p>';
            document.getElementById('queue-container').innerHTML = '<p class="text-xs text-slate-500">A aguardar configuração...</p>';
            document.getElementById('agents-container').innerHTML = '<p class="text-xs text-slate-500">A aguardar configuração...</p>';
        } else {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            carregarDadosDashboard();
        }

        async function carregarDadosDashboard() {
            if (!supabaseClient) return;

            badge.textContent = 'A sincronizar...';
            badge.className = 'font-bold text-amber-400';

            try {
                // 1. PUXAR MÉTRICAS E VISUALIZAÇÕES
                const { data: metrics, error: errMetrics } = await supabaseClient
                    .from('influencer_metrics')
                    .select('*')
                    .order('checked_at', { ascending: false });

                if (errMetrics) throw errMetrics;

                const metricsDiv = document.getElementById('metrics-container');
                let totalViews = 0;

                if (metrics && metrics.length > 0) {
                    metricsDiv.innerHTML = metrics.map(m => {
                        totalViews += Number(m.views || 0);
                        return `
                        <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 flex justify-between items-center">
                            <div class="pr-2">
                                <p class="font-bold text-sm text-slate-200">${m.influencer_name}</p>
                                <p class="text-xs text-slate-400 mt-0.5">${m.platform} • ${m.post_title || 'Publicação'}</p>
                            </div>
                            <div class="text-right shrink-0">
                                <span class="text-emerald-400 font-bold text-base">${Number(m.views || 0).toLocaleString('pt-PT')}</span>
                                <p class="text-[10px] text-slate-500 uppercase">Views</p>
                            </div>
                        </div>`;
                    }).join('');
                } else {
                    metricsDiv.innerHTML = `<p class="text-xs text-slate-500">Nenhuma métrica registada ainda.</p>`;
                }
                document.getElementById('total-views-badge').textContent = `${totalViews.toLocaleString('pt-PT')} views`;

                // 2. PUXAR FILA DE AGENDAMENTO (QUEUE)
                const { data: queue, error: errQueue } = await supabaseClient
                    .from('queue')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(10);

                const queueDiv = document.getElementById('queue-container');
                if (!errQueue && queue && queue.length > 0) {
                    queueDiv.innerHTML = queue.map(q => {
                        const titulo = q.payload && q.payload.title ? q.payload.title : 'Tarefa sem título';
                        const hora = q.scheduled_for ? new Date(q.scheduled_for).toLocaleTimeString('pt-PT', {hour: '2-digit', minute:'2-digit'}) : '--:--';
                        const corStatus = q.status === 'completed' ? 'text-emerald-400' : 'text-amber-400';
                        return `
                        <div class="bg-slate-950 px-3 py-2 rounded-lg border border-slate-800 flex justify-between items-center text-xs">
                            <div class="truncate pr-2">
                                <span class="font-bold text-slate-300">${q.agent_name}</span>
                                <span class="text-slate-500"> (${q.platform})</span>
                                <p class="text-[11px] text-slate-400 truncate">${titulo}</p>
                            </div>
                            <div class="text-right shrink-0">
                                <span class="font-bold ${corStatus} uppercase text-[10px]">${q.status}</span>
                                <p class="text-[10px] text-slate-500">${hora}</p>
                            </div>
                        </div>`;
                    }).join('');
                } else {
                    queueDiv.innerHTML = `<p class="text-xs text-slate-500">Fila vazia ou sem permissões de leitura.</p>`;
                }

                // 3. PUXAR ESTADO DOS AGENTES (KILL SWITCH)
                const { data: agents, error: errAgents } = await supabaseClient
                    .from('agents_status')
                    .select('*')
                    .order('agent_name', { ascending: true });

                const agentsDiv = document.getElementById('agents-container');
                if (!errAgents && agents && agents.length > 0) {
                    agentsDiv.innerHTML = agents.map(a => {
                        const isActive = a.status === 'active';
                        return `
                        <div class="bg-slate-950 px-3 py-2 rounded-lg border border-slate-800 flex justify-between items-center text-xs">
                            <span class="text-slate-200 font-medium">${a.agent_name}</span>
                            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold tracking-wide ${isActive ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-red-950 text-red-400 border border-red-800'}">
                                ${a.status.toUpperCase()}
                            </span>
                        </div>`;
                    }).join('');
                } else {
                    agentsDiv.innerHTML = `<p class="text-xs text-slate-500">Nenhum agente encontrado.</p>`;
                }

                // Marca ligação como concluída com sucesso
                badge.textContent = 'ONLINE';
                badge.className = 'font-bold text-emerald-400';

            } catch (err) {
                console.error('Erro Supabase:', err);
                badge.textContent = 'ERRO DE LIGAÇÃO';
                badge.className = 'font-bold text-red-400';
            }
        }
    </script>
</body>
</html>
